  /api/v4/posts/{post_id}/thread:
    get:
      tags:
      - posts
      summary: Get a thread
      description: 'Get a post and the rest of the posts in the same thread.

        ##### Permissions

        Must have `read_channel` permission for the channel the post is in or if the
        channel is public, have the `read_public_channels` permission for the team.

        '
      operationId: GetPostThread
      parameters:
      - name: post_id
        in: path
        description: ID of a post in the thread
        required: true
        schema:
          type: string
      - name: perPage
        in: query
        description: The number of posts per page
        schema:
          type: integer
          default: 0
      - name: fromPost
        in: query
        description: The post_id to return the next page of posts from
        schema:
          type: string
          default: ''
      - name: fromCreateAt
        in: query
        description: The create_at timestamp to return the next page of posts from
        schema:
          type: integer
          default: 0
      - name: fromUpdateAt
        in: query
        description: The update_at timestamp to return the next page of posts from.
          You cannot set this flag with direction=down.
        schema:
          type: integer
          default: 0
      - name: direction
        in: query
        description: The direction to return the posts. Either up or down.
        schema:
          type: string
          default: ''
      - name: skipFetchThreads
        in: query
        description: Whether to skip fetching threads or not
        schema:
          type: boolean
          default: false
      - name: collapsedThreads
        in: query
        description: Whether the client uses CRT or not
        schema:
          type: boolean
          default: false
      - name: collapsedThreadsExtended
        in: query
        description: Whether to return the associated users as part of the response
          or not
        schema:
          type: boolean
          default: false
      - name: updatesOnly
        in: query
        description: This flag is used to make the API work with the updateAt value.
          If you set this flag, you must set a value for fromUpdateAt.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Post list retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v4/posts:
    post:
      tags:
      - posts
      summary: Create a post
      description: 'Create a new post in a channel. To create the post as a comment
        on another post, provide `root_id`.

        ##### Permissions

        Must have `create_post` permission for the channel the post is being created
        in.

        '
      operationId: CreatePost
      parameters:
      - name: set_online
        in: query
        description: Whether to set the user status as online or not.
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - channel_id
              - message
              properties:
                channel_id:
                  type: string
                  description: The channel ID to post in
                message:
                  type: string
                  description: The message contents, can be formatted with Markdown
                root_id:
                  type: string
                  description: The post ID to comment on
                file_ids:
                  type: array
                  description: A list of file IDs to associate with the post. Note
                    that posts are limited to 5 files maximum. Please use additional
                    posts for more files.
                  items:
                    type: string
                props:
                  description: A general JSON property bag to attach to the post
                  type: object
                metadata:
                  description: A JSON object to add post metadata, e.g the post's
                    priority
                  type: object
                  properties:
                    priority:
                      type: object
                      description: An object containing the post's priority properties
                      properties:
                        priority:
                          type: string
                          description: The priority label of the post, could empty,
                            important, or urgent
                        requested_ack:
                          type: boolean
                          description: Set to true to request for acknowledgements
        description: Post object to create
        required: true
      responses:
        '201':
          description: Post creation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v4/channels/direct:
    post:
      tags:
      - channels
      summary: Create a direct message channel
      description: 'Create a new direct message channel between two users.

        ##### Permissions

        Must be one of the two users and have `create_direct_channel` permission.
        Having the `manage_system` permission voids the previous requirements.

        '
      operationId: CreateDirectChannel
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              minItems: 2
              maxItems: 2
        description: The two user ids to be in the direct message
        required: true
      responses:
        '201':
          description: Direct channel creation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-codeSamples:
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\
          \"os\"\n\n\t\"github.com/mattermost/mattermost/server/public/model\"\n)\n\
          \nfunc main() {\n\tclient := model.NewAPIv4Client(os.Getenv(\"MM_SERVICESETTINGS_SITEURL\"\
          ))\n\tclient.SetToken(os.Getenv(\"MM_AUTHTOKEN\"))\n\n\tuserID1 := \"user_id_1\"\
          \n\tuserID2 := \"user_id_2\"\n\tchannel, _, err := client.CreateDirectChannel(context.Background(),\
          \ userID1, userID2)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tfmt.Printf(\"\
          Created direct message channel with id %s for users %s and %s\\n\", channel.Id,\
          \ userID1, userID2)\n}\n"
  /api/v4/channels/group:
    post:
      tags:
      - channels
      summary: Create a group message channel
      description: 'Create a new group message channel to group of users. If the logged
        in user''s id is not included in the list, it will be appended to the end.

        ##### Permissions

        Must have `create_group_channel` permission.

        '
      operationId: CreateGroupChannel
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              minItems: 3
              maxItems: 8
        description: User ids to be in the group message channel.
        required: true
      responses:
        '201':
          description: Group channel creation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-codeSamples:
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\
          \"os\"\n\n\t\"github.com/mattermost/mattermost/server/public/model\"\n)\n\
          \nfunc main() {\n\tclient := model.NewAPIv4Client(os.Getenv(\"MM_SERVICESETTINGS_SITEURL\"\
          ))\n\tclient.SetToken(os.Getenv(\"MM_AUTHTOKEN\"))\n\n\tuserIDs := []string{\"\
