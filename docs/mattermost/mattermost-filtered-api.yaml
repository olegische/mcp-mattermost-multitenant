openapi: 3.0.0
info:
  description: "The Mattermost Web Services API enables Mattermost clients and third-party\
    \ applications to interact with Mattermost servers.\n\n[Official JavaScript and\
    \ Golang drivers](#/#official-drivers) are available to simplify API integration.\n\
    \nBy using this API, you agree to our [terms of service](https://about.mattermost.com/default-terms/).\n\
    \n[Find out more about Mattermost](https://about.mattermost.com/)\n## Contents\n\
    ### Core Concepts\n* [Schema & Conventions](#/#schema--conventions)\n* [Authentication](#/#authentication)\n\
    * [Rate Limiting](#/#rate-limiting)\n* [Error Handling](#/#error-handling)\n*\
    \ [WebSocket](#/#websocket)\n\n  * [Authentication](#/#authentication-1)\n\n \
    \ * [Websocket Events](#/#websocket-events)\n\n  * [Websocket API](#/#websocket-api)\n\
    \n### Drivers\n* [Official Drivers](#/#official-drivers)\n* [Community-built Drivers](#/#community-built-drivers)\n\
    ### Community\n* [Support](#/#support)\n* [Contributing](#/#contributing)\n\n\
    ## Schema & Conventions\n- All API access is through HTTP(S) requests at `your-mattermost-url/api/v4`.\n\
    - All request and response bodies are `application/json`.\n- When using endpoints\
    \ that require a user id, the string `me` can be used in place of the user id\
    \ to indicate the action is to be taken for the logged in user.\n- For all endpoints\
    \ that implement pagination via the `per_page` parameter:\n\n  - Maximum items\
    \ per page: 200 (requests exceeding this will be silently truncated)\n\n  - Default\
    \ value if a paged API requires a `per_page` parameter and it is not provided:\
    \ 60\n\n## Authentication\n\n  There are multiple ways to authenticate against\
    \ the Mattermost API.\n\n  All examples assume there is a Mattermost instance\
    \ running at http://localhost:8065.\n\n  ### Session Token\n\n  Make an HTTP POST\
    \ to `your-mattermost-url/api/v4/users/login` with a JSON\n  body indicating the\
    \ user's `login_id`, `password` and optionally the MFA\n  `token`. The `login_id`\
    \ can be an email, username or an AD/LDAP ID\n  depending on the system's configuration.\n\
    \n  ```bash\n  curl -i -d '{\"login_id\":\"someone@nowhere.com\",\"password\"\
    :\"thisisabadpassword\"}' http://localhost:8065/api/v4/users/login\n  ```\n\n\
    \  NOTE: If you're running cURL on windows, you will have to change the single\
    \ quotes to double quotes, and escape the inner double quotes with backslash,\
    \ like below:\n\n\n  ```bash\n  curl -i -d \"{\\\"login_id\\\":\\\"someone@nowhere.com\\\
    \",\\\"password\\\":\\\"thisisabadpassword\\\"}\" http://localhost:8065/api/v4/users/login\n\
    \  ```\n\n  If successful, the response will contain a `Token` header and a user\
    \ object in the body.\n\n  ```http\n  HTTP/1.1 200 OK\n  Content-Type: application/json\n\
    \  Permissions-Policy:\n  Referrer-Policy: no-referrer\n  Token: ckh3t4knu3fzujt76o57f5jo4w\n\
    \  Vary: Origin\n  Vary: Accept-Encoding\n  X-Content-Type-Options: nosniff\n\
    \  X-Request-Id: bk3uzm335jr9tnoh4mcsybmmjr\n  X-Version-Id: 10.6.0.13685270376.215f100adf6ccda09afcaaa84ac4bfbd.true\n\
    \  Date: Fri, 28 Mar 2025 09:33:22 GMT\n  Content-Length: 796\n\n  {{user object\
    \ as json}}\n  ```\n\n  Include the `Token` as part of the `Authorization` header\
    \ on your future API requests with the `Bearer` method.\n\n  ```bash\n  curl -i\
    \ -H 'Authorization: Bearer ckh3t4knu3fzujt76o57f5jo4w' http://localhost:8065/api/v4/users/me\n\
    \  ```\n  Alternatively, include the `Token` as your `MMAUTHTOKEN` cookie value\
    \ on you future API requests:\n\n  ```bash\n  curl -i -H 'Cookie: MMAUTHTOKEN=ckh3t4knu3fzujt76o57f5jo4w'\
    \ http://localhost:8065/api/v4/users/me\n  ```\n\n\n  You should now be able to\
    \ access the API as the user you logged in as.\n\n\n  ### Personal Access Tokens\n\
    \n  Using [personal access tokens](https://developers.mattermost.com/integrate/reference/personal-access-token/)\
    \ is very similar to using a session token. The only real difference is that session\
    \ tokens will expire, while personal access tokens will live until they are manually\
    \ revoked by the user or an admin.\n\n  Just like session tokens, include the\
    \ personal access token as part of the `Authorization` header in your requests\
    \ using the `Bearer` method. Assuming our personal access token is `9xuqwrwgstrb3mzrxb83nb357a`,\
    \ we could use it as shown below.\n\n  ```bash\n  curl -i -H 'Authorization: Bearer\
    \ 9xuqwrwgstrb3mzrxb83nb357a' http://localhost:8065/api/v4/users/me\n  ```\n\n\
    ## Rate Limiting\n  Whenever you make an HTTP request to the Mattermost API you\
    \ might notice\n  the following headers included in the response:\n\n  ```http\n\
    \  X-Ratelimit-Limit: 10\n  X-Ratelimit-Remaining: 9\n  X-Ratelimit-Reset: 1441983590\n\
    \  ```\n\n\n  These headers are telling you your current rate limit status.\n\n\
    \n  | Header                  | Description                                  \
    \                      |\n  |:-----------------------|:-------------------------------------------------------------------|\n\
    \  | X-Ratelimit-Limit      | The maximum number of requests you can make per\
    \ second.            |\n  | X-Ratelimit-Remaining  | The number of requests remaining\
    \ in the current window.            |\n  | X-Ratelimit-Reset      | The remaining\
    \ UTC epoch seconds before the rate limit resets.      |\n\n  If you exceed your\
    \ rate limit for a window you will receive the following error in the body of\
    \ the response:\n\n  ```http\n  HTTP/1.1 429 Too Many Requests\n  Date: Tue, 10\
    \ Sep 2015 11:20:28 GMT\n  X-RateLimit-Limit: 10\n  X-RateLimit-Remaining: 0\n\
    \  X-RateLimit-Reset: 1\n\n  limit exceeded\n  ```\n\n## Error Handling\n\n  All\
    \ errors will return an appropriate HTTP response code along with the\n  following\
    \ JSON body:\n\n  ```json\n  {\n      \"id\": \"the.error.id\",\n      \"message\"\
    : \"Something went wrong\", // the reason for the error\n      \"request_id\"\
    : \"\", // the ID of the request\n      \"status_code\": 0, // the HTTP status\
    \ code\n      \"is_oauth\": false // whether the error is OAuth specific\n  }\n\
    \n  ```\n\n## WebSocket\n In addition to the HTTP RESTful web service, Mattermost\
    \ also offers a WebSocket event delivery system and some API functionality.\n\n\
    \ To connect to the WebSocket follow the standard opening handshake as [defined\
    \ by the RFC specification](https://tools.ietf.org/html/rfc6455#section-1.3) to\
    \ the `/api/v4/websocket` endpoint of Mattermost.\n\n\n### Authentication\n\n\
    \  The Mattermost WebSocket can be authenticated using [the standard API authentication\
    \ methods](/#/#authentication) (by a cookie or with an explicit Authorization\
    \ header) or through an authentication challenge. If you're authenticating from\
    \ a browser and have logged in with the Mattermost API, your authentication cookie\
    \ should already be set. This is how the Mattermost webapp authenticates with\
    \ the WebSocket.\n\n  To authenticate with an authentication challenge, first\
    \ connect the WebSocket and then send the following JSON over the connection:\n\
    \n\n  ```json\n  {\n    \"seq\": 1,\n    \"action\": \"authentication_challenge\"\
    ,\n    \"data\": {\n      \"token\": \"mattermosttokengoeshere\"\n    }\n  }\n\
    \  ```\n\n  If successful, you will receive a standard OK response over the WebSocket\
    \ connection:\n\n\n  ```json\n  {\n    \"status\": \"OK\",\n    \"seq_reply\"\
    : 1\n  }\n  ```\n\n  Once successfully authenticated, the server will pass a `hello`\
    \ WebSocket event containing server version over the connection.\n\n### Websocket\
    \ Events\n\n  WebSocket events are primarily used to alert the client to changes\
    \ in Mattermost, such as delivering new posts or alerting the client that another\
    \ user is typing in a channel.\n\n  Events on the WebSocket will have the form:\n\
    \n  ```json\n  {\n    \"event\": \"hello\",\n    \"data\": {\n      \"server_version\"\
    : \"3.6.0.1451.1c38da627ebb4e3635677db6939e9195\"\n    },\n    \"broadcast\":{\n\
    \      \"omit_users\": null,\n      \"user_id\": \"ay5sq51sebfh58ktrce5ijtcwy\"\
    ,\n      \"channel_id\": \"\",\n      \"team_id\": \"\"\n    },\n    \"seq\":\
    \ 0\n  }\n  ```\n\n  The `event` field indicates the event type, `data` contains\
    \ any data relevant to the event and `broadcast` contains information about who\
    \ the event was sent to. For example, the above example has `user_id` set to \"\
    ay5sq51sebfh58ktrce5ijtcwy\" meaning that only the user with that ID received\
    \ this event broadcast. The `omit_users` field can contain an array of user IDs\
    \ that were specifically omitted from receiving the event.\n\n  The list of Mattermost\
    \ WebSocket events are:\n\n  - added_to_team\n  - authentication_challenge\n \
    \ - channel_converted\n  - channel_created\n  - channel_deleted\n  - channel_member_updated\n\
    \  - channel_updated\n  - channel_viewed\n  - config_changed\n  - delete_team\n\
    \  - direct_added\n  - emoji_added\n  - ephemeral_message\n  - group_added\n \
    \ - hello\n  - leave_team\n  - license_changed\n  - memberrole_updated\n  - new_user\n\
    \  - plugin_disabled\n  - plugin_enabled\n  - plugin_statuses_changed\n  - post_deleted\n\
    \  - post_edited\n  - post_unread\n  - posted\n  - preference_changed\n  - preferences_changed\n\
    \  - preferences_deleted\n  - reaction_added\n  - reaction_removed\n  - response\n\
    \  - role_updated\n  - status_change\n  - typing\n  - update_team\n  - user_added\n\
    \  - user_removed\n  - user_role_updated\n  - user_updated\n  - dialog_opened\n\
    \  - thread_updated\n  - thread_follow_changed\n  - thread_read_changed\n\n###\
    \ Websocket API\n\n  Mattermost has some basic support for WebSocket APIs. A connected\
    \ WebSocket can make requests by sending the following over the connection:\n\n\
    \  ```json\n  {\n    \"action\": \"user_typing\",\n    \"seq\": 2,\n    \"data\"\
    : {\n      \"channel_id\": \"nhze199c4j87ped4wannrjdt9c\",\n      \"parent_id\"\
    : \"\"\n    }\n  }\n  ```\n\n  This is an example of making a `user_typing` request,\
    \ with the purpose of alerting the server that the connected client has begun\
    \ typing in a channel or thread. The `action` field indicates what is being requested,\
    \ and performs a similar duty as the route in a HTTP API. The `data` field is\
    \ used to add any additional data along with the request. The server supports\
    \ binary websocket messages as well in case the client has such a requirement.\n\
    \n  The `seq` or sequence number is set by the client and should be incremented\
    \ with every use. It is used to distinguish responses to requests that come down\
    \ the WebSocket. For example, a standard response to the above request would be:\n\
    \n\n  ```json\n  {\n    \"status\": \"OK\",\n    \"seq_reply\": 2\n  }\n  ```\n\
    \n  Notice `seq_reply` is 2, matching the `seq` of the original request. Using\
    \ this a client can distinguish which request the response is meant for.\n\n \
    \ If there was any information to respond with, it would be encapsulated in a\
    \ `data` field.\n\n  In the case of an error, the response would be:\n\n\n  ```json\n\
    \  {\n    \"status\": \"FAIL\",\n    \"seq_reply\": 2,\n    \"error\": {\n   \
    \   \"id\": \"some.error.id.here\",\n      \"message\": \"Some error message here\"\
    \n    }\n  }\n  ```\n\n\n  The list of WebSocket API actions is:\n\n  - user_typing\n\
    \  - get_statuses\n  - get_statuses_by_ids\n\n\n  To see how these actions work,\
    \ please refer to either the [Golang WebSocket driver](https://github.com/mattermost/mattermost/blob/master/server/public/model/websocket_client.go)\
    \ or our [JavaScript WebSocket driver](https://github.com/mattermost/mattermost/blob/master/webapp/platform/client/src/websocket.ts).\n\
    \n## Drivers\n  The easiest way to interact with the Mattermost Web Service API\
    \ is through\n  a language specific driver.\n\n  ### Official Drivers\n\n  * Mattermost\
    \ JavaScript/TypeScript Driver\n    * [NPM](https://www.npmjs.com/package/@mattermost/client)\n\
    \    * [Source](https://github.com/mattermost/mattermost/tree/master/webapp/platform/client)\n\
    \n  * [Mattermost Golang Driver](https://pkg.go.dev/github.com/mattermost/mattermost/server/public/model#Client4)\n\
    \n  ### Community-built Drivers\n\n  For community-built drivers and API wrappers,\
    \ see [our app directory](https://mattermost.com/marketplace-category/mattermost-developers-tools/).\n\
    \n## Support\nMattermost core committers work with the community to keep the API\
    \ documentation up-to-date.\nIf you have questions on API routes not listed in\
    \ this reference, you can:\n- [Join the Mattermost community server](https://community.mattermost.com)\
    \ to ask questions in the Developers channel\n- Contact us at feedback@mattermost.com\n\
    \n[Bug reports](https://github.com/mattermost/mattermost/issues) in the documentation\
    \ or the API are also welcome, as are pull requests to fix the issues.\n\n## Contributing\n\
    When you have answers to API questions not addressed in our documentation we ask\
    \ you to consider making a pull request to improve our reference. Small and large\
    \ changes are all welcome.\n\nWe also have [Help Wanted tickets](https://github.com/mattermost/mattermost/issues?q=is%3Aopen+is%3Aissue+label%3AArea%2FAPI)\
    \ available for community members who would like to help others more easily use\
    \ the APIs. We acknowledge everyone's contribution in the [release notes of our\
    \ next version](https://docs.mattermost.com/administration/changelog.html#contributors).\n\
    \nThe source code for this API reference is hosted at https://github.com/mattermost/mattermost/tree/master/api.\n"
  version: 4.0.0
  title: Mattermost API
servers:
- url: '{your-mattermost-url}'
  variables:
    your-mattermost-url:
      default: http://localhost:8065
paths:
  /api/v4/users/{user_id}/teams/{team_id}/threads:
    get:
      tags:
        - threads
      summary: Get all threads that user is following
      description: |
        Get all threads that user is following

        __Minimum server version__: 5.29

        ##### Permissions
        Must be logged in as the user or have `edit_other_users` permission.
      operationId: GetUserThreads
      parameters:
        - name: user_id
          in: path
          description: The ID of the user. This can also be "me" which will point to the current user.
          required: true
          schema:
            type: string
        - name: team_id
          in: path
          description: The ID of the team in which the thread is.
          required: true
          schema:
            type: string
        - name: since
          in: query
          description: Since filters the threads based on their LastUpdateAt timestamp.
          schema:
            type: integer
        - name: deleted
          in: query
          description: Deleted will specify that even deleted threads should be returned (For mobile sync).
          schema:
            type: boolean
            default: false
        - name: extended
          in: query
          description: Extended will enrich the response with participant details.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          description: Page specifies which part of the results to return, by per_page.
          schema:
            type: integer
            default: 0
        - name: per_page
          in: query
          description: The size of the returned chunk of results.
          schema:
            type: integer
            default: 60
        - name: totalsOnly
          in: query
          description: Setting this to true will only return the total counts.
          schema:
            type: boolean
            default: false
        - name: threadsOnly
          in: query
          description: Setting this to true will only return threads.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: User's thread retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserThreads'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v4/users/{user_id}/teams/{team_id}/threads/mention_counts:
    get:
      tags:
        - threads
      summary: Get all unread mention counts from followed threads, per-channel
      description: |
        Get all unread mention counts from followed threads

        __Minimum server version__: 5.29

        ##### Permissions
        Must be logged in as the user or have `edit_other_users` permission.
      operationId: GetThreadMentionCountsByChannel
      parameters:
        - name: user_id
          in: path
          description: The ID of the user. This can also be "me" which will point to the current user.
          required: true
          schema:
            type: string
        - name: team_id
          in: path
          description: The ID of the team in which the thread is.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Get was successful
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v4/users/{user_id}/teams/{team_id}/threads/read:
    put:
      tags:
        - threads
      summary: Mark all threads that user is following as read
      description: |
        Mark all threads that user is following as read

        __Minimum server version__: 5.29

        ##### Permissions
        Must be logged in as the user or have `edit_other_users` permission.
      operationId: UpdateThreadsReadForUser
      parameters:
        - name: user_id
          in: path
          description: The ID of the user. This can also be "me" which will point to the current user.
          required: true
          schema:
            type: string
        - name: team_id
          in: path
          description: The ID of the team in which the thread is.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User's thread update successful
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v4/users/{user_id}/teams/unread:
    get:
      tags:
        - teams
      summary: Get team unreads for a user
      description: >
        Get the count for unread messages and mentions in the teams the user is a member of.

        ##### Permissions

        Must be logged in.

      operationId: GetTeamsUnreadForUser
      parameters:
        - name: user_id
          in: path
          description: User GUID
          required: true
          schema:
            type: string
        - name: exclude_team
          in: query
          description: Optional team id to be excluded from the results
          required: true
          schema:
            type: string
        - name: include_collapsed_threads
          in: query
          description: Boolean to determine whether the collapsed threads should be included or not
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Team unreads retrieval successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUnread'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v4/users/{user_id}/teams/{team_id}/unread:
    get:
      tags:
        - teams
      summary: Get unreads for a team
      description: >
        Get the unread mention and message counts for a team for the specified user.

        ##### Permissions

        Must be the user or have `edit_other_users` permission and have `view_team` permission for the team.

      operationId: GetTeamUnread
      parameters:
        - name: user_id
          in: path
          description: User GUID
          required: true
          schema:
            type: string
        - name: team_id
          in: path
          description: Team GUID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team unread count retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamUnread'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v4/users/{user_id}/channels:
    get:
      tags:
        - channels
      summary: Get all channels from all teams
      description: |
        Get all channels from all teams that a user is a member of.

        __Minimum server version__: 6.1

        ##### Permissions

        Logged in as the user, or have `edit_other_users` permission.
      operationId: GetChannelsForUser
      parameters:
        - name: user_id
          in: path
          description: The ID of the user. This can also be "me" which will point to the current user.
          required: true
          schema:
            type: string
        - name: last_delete_at
          in: query
          description: Filters the deleted channels by this time in epoch format. Does not have any effect if include_deleted is set to false.
          schema:
            type: integer
            default: 0
        - name: include_deleted
          in: query
          description: Defines if deleted channels should be returned or not
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Channels retrieval successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v4/users/{user_id}/channels/{channel_id}/unread:
    get:
      tags:
      - channels
      summary: Get unread messages
      description: 'Get the total unread messages and mentions for a channel for a
        user.

        ##### Permissions

        Must be logged in as user and have the `read_channel` permission, or have
        `edit_other_usrs` permission.

        '
      operationId: GetChannelUnread
      parameters:
      - name: user_id
        in: path
        description: User GUID
        required: true
        schema:
          type: string
      - name: channel_id
        in: path
        description: Channel GUID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel unreads retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelUnread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v4/users/{user_id}:
    get:
      tags:
        - users
      summary: Get a user
      description: |
        Get a user a object. Sensitive information will be sanitized out.
        ##### Permissions
        Requires an active session but no other permissions.
      operationId: GetUser
      parameters:
        - name: user_id
          in: path
          description: User GUID. This can also be "me" which will point to the current user.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v4/users/{user_id}/teams:
    get:
      tags:
        - teams
      summary: Get a user's teams
      description: >
        Get a list of teams that a user is on.

        ##### Permissions

        Must be authenticated as the user or have the `manage_system` permission.

      operationId: GetTeamsForUser
      parameters:
        - name: user_id
          in: path
          description: User GUID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team list retrieval successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\
          \"os\"\n\n\t\"github.com/mattermost/mattermost/server/public/model\"\n)\n\
          \nfunc main() {\n\tclient := model.NewAPIv4Client(os.Getenv(\"MM_SERVICESETTINGS_SITEURL\"\
          ))\n\tclient.SetToken(os.Getenv(\"MM_AUTHTOKEN\"))\n\n\tchannelId := \"\
          channel_id\"\n\tuserId := \"user_id\"\n\tchannelUnread, _, err := client.GetChannelUnread(context.Background(),\
          \ channelId, userId)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tfmt.Printf(\"\
          Found %d unread messages with %d mentions for user %s in channel %s\\n\"\
