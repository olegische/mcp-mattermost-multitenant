          \ userIDs)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tfmt.Printf(\"\
          Created group message channel with id %s for users %s, %s and %s\\n\", channel.Id,\
          \ userIDs[0], userIDs[1], userIDs[2])\n}\n"
  /api/v4/channels:
    post:
      tags:
      - channels
      summary: Create a channel
      description: 'Create a new channel.

        ##### Permissions

        If creating a public channel, `create_public_channel` permission is required.
        If creating a private channel, `create_private_channel` permission is required.

        '
      operationId: CreateChannel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - display_name
              - type
              - team_id
              properties:
                team_id:
                  type: string
                  description: The team ID of the team to create the channel on
                name:
                  type: string
                  description: The unique handle for the channel, will be present
                    in the channel URL
                display_name:
                  type: string
                  description: The non-unique UI name for the channel
                purpose:
                  type: string
                  description: A short description of the purpose of the channel
                header:
                  type: string
                  description: Markdown-formatted text to display in the header of
                    the channel
                type:
                  type: string
                  description: '''O'' for a public channel, ''P'' for a private channel'
        description: Channel object to be created
        required: true
      responses:
        '201':
          description: Channel creation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-codeSamples:
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\
          \"os\"\n\n\t\"github.com/mattermost/mattermost/server/public/model\"\n)\n\
          \nfunc main() {\n\tclient := model.NewAPIv4Client(os.Getenv(\"MM_SERVICESETTINGS_SITEURL\"\
          ))\n\tclient.SetToken(os.Getenv(\"MM_AUTHTOKEN\"))\n\n\tchannel, _, err\
          \ := client.CreateChannel(context.Background(), &model.Channel{\n\t\tName:\
          \        \"channel_name\",\n\t\tDisplayName: \"Channel Name\",\n\t\tType:\
          \        model.ChannelTypeOpen,\n\t\tTeamId:      \"team_id\",\n\t})\n\t\
          if err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tfmt.Printf(\"Created channel\
          \ with id %s\\n\", channel.Id)\n}\n"
  /api/v4/teams/{team_id}/channels/search:
    post:
      tags:
      - channels
      summary: Search channels
      description: 'Search public channels on a team based on the search term provided
        in the request body.

        ##### Permissions

        Must have the `list_team_channels` permission.


        In server version 5.16 and later, a user without the `list_team_channels`
        permission will be able to use this endpoint, with the search results limited
        to the channels that the user is a member of.

        '
      operationId: SearchChannels
      parameters:
      - name: team_id
        in: path
        description: Team GUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - term
              properties:
                term:
                  description: The search term to match against the name or display
                    name of channels
                  type: string
        description: Search criteria
        required: true
      responses:
        '201':
          description: Channels search successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-codeSamples:
      - lang: Go
        source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\
          \"os\"\n\n\t\"github.com/mattermost/mattermost/server/public/model\"\n)\n\
          \nfunc main() {\n\tclient := model.NewAPIv4Client(os.Getenv(\"MM_SERVICESETTINGS_SITEURL\"\
          ))\n\tclient.SetToken(os.Getenv(\"MM_AUTHTOKEN\"))\n\n\tteamId := \"team_id\"\
          \n\tsearchTerm := \"search\"\n\tchannels, _, err := client.SearchChannels(context.Background(),\
          \ teamId, &model.ChannelSearch{\n\t\tTerm: searchTerm,\n\t})\n\tif err !=\
          \ nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tfmt.Printf(\"Found %d channels on\
          \ team %s matching term '%s'\\n\", len(channels), teamId, searchTerm)\n\
          }\n"
  /api/v4/teams/{team_id}/posts/search:
    post:
      tags:
      - posts
      summary: Search for team posts
      description: 'Search posts in the team and from the provided terms string.

        ##### Permissions

        Must be authenticated and have the `view_team` permission.

        '
      operationId: SearchPosts
      parameters:
      - name: team_id
        in: path
        description: Team GUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - terms
              - is_or_search
              properties:
                terms:
                  type: string
                  description: The search terms as inputed by the user. To search
                    for posts from a user include `from:someusername`, using a user's
                    username. To search in a specific channel include `in:somechannel`,
                    using the channel name (not the display name).
                is_or_search:
                  type: boolean
                  description: Set to true if an Or search should be performed vs
                    an And search.
                time_zone_offset:
                  type: integer
                  default: 0
                  description: Offset from UTC of user timezone for date searches.
                include_deleted_channels:
                  type: boolean
                  description: Set to true if deleted channels should be included
                    in the search. (archived channels)
                page:
                  type: integer
                  default: 0
                  description: The page to select. (Only works with Elasticsearch)
                per_page:
                  type: integer
                  default: 60
                  description: The number of posts per page. (Only works with Elasticsearch)
        description: The search terms and logic to use in the search.
        required: true
      responses:
        '200':
          description: Post list retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostListWithSearchMatches'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v4/channels/{channel_id}/posts:
    get:
      tags:
      - posts
      summary: Get posts for a channel
      description: 'Get a page of posts in a channel. Use the query parameters to
        modify the behaviour of this endpoint. The parameter `since` must not be used
        with any of `before`, `after`, `page`, and `per_page` parameters.

        If `since` is used, it will always return all posts modified since that time,
        ordered by their create time limited till 1000. A caveat with this parameter
        is that there is no guarantee that the returned posts will be consecutive.
        It is left to the clients to maintain state and fill any missing holes in
        the post order.

        ##### Permissions

        Must have `read_channel` permission for the channel.

        '
      operationId: GetPostsForChannel
      parameters:
      - name: channel_id
        in: path
        description: The channel ID to get the posts for
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: The page to select
        schema:
          type: integer
          default: 0
      - name: per_page
        in: query
        description: The number of posts per page
        schema:
          type: integer
          default: 60
      - name: since
        in: query
        description: Provide a non-zero value in Unix time milliseconds to select
          posts modified after that time
        schema:
          type: integer
      - name: before
        in: query
        description: A post id to select the posts that came before this one
        schema:
          type: string
      - name: after
        in: query
        description: A post id to select the posts that came after this one
        schema:
          type: string
      - name: include_deleted
        in: query
        description: Whether to include deleted posts or not. Must have system admin
          permissions.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Post list retrieval successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a user was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a user was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a user was deleted
          type: integer
          format: int64
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        nickname:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        auth_service:
          type: string
        roles:
          type: string
        locale:
          type: string
        notify_props:
          $ref: '#/components/schemas/UserNotifyProps'
        props:
          type: object
        last_password_update:
          type: integer
          format: int64
        last_picture_update:
          type: integer
          format: int64
        failed_attempts:
          type: integer
        mfa_active:
          type: boolean
        timezone:
          $ref: '#/components/schemas/Timezone'
        terms_of_service_id:
          description: ID of accepted terms of service, if any. This field is not present if empty.
          type: string
        terms_of_service_create_at:
          description: The time in milliseconds the user accepted the terms of service
          type: integer
          format: int64
    UsersStats:
      type: object
      properties:
        total_users_count:
          type: integer
    KnownUsers:
      type: array
      properties:
        items:
          type: string
    Team:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a team was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a team was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a team was deleted
          type: integer
          format: int64
        display_name:
          type: string
        name:
          type: string
        description:
          type: string
        email:
          type: string
        type:
          type: string
        allowed_domains:
          type: string
        invite_id:
          type: string
        allow_open_invite:
          type: boolean
        policy_id:
          type: string
          description: The data retention policy to which this team has been assigned. If no such policy exists, or the caller does not have the `sysconsole_read_compliance_data_retention` permission, this field will be null.
    TeamStats:
      type: object
      properties:
        team_id:
          type: string
        total_member_count:
          type: integer
    TeamExists:
      type: object
      properties:
        exists:
          type: boolean
    UserNotifyProps:
      type: object
      properties:
        email:
          type: string
          description: Set to "true" to enable email notifications, "false" to disable. Defaults to "true".
        push:
          type: string
          description: Set to "all" to receive push notifications for all activity, "mention" for mentions and direct messages only, and "none" to disable. Defaults to "mention".
        desktop:
          type: string
          description: Set to "all" to receive desktop notifications for all activity, "mention" for mentions and direct messages only, and "none" to disable. Defaults to "all".
        desktop_sound:
          type: string
          description: Set to "true" to enable sound on desktop notifications, "false" to disable. Defaults to "true".
        mention_keys:
          type: string
          description: A comma-separated list of words to count as mentions. Defaults to username and @username.
        channel:
          type: string
          description: Set to "true" to enable channel-wide notifications (@channel, @all, etc.), "false" to disable. Defaults to "true".
        first_name:
          type: string
          description: Set to "true" to enable mentions for first name. Defaults to "true" if a first name is set, "false" otherwise.
    Timezone:
      type: object
      properties:
        useAutomaticTimezone:
          type: boolean
          description: Set to "true" to use the browser/system timezone, "false" to set manually. Defaults to "true".
        manualTimezone:
          type: string
          description: Value when setting manually the timezone, i.e. "Europe/Berlin".
        automaticTimezone:
          type: string
          description: This value is set automatically when the "useAutomaticTimezone" is set to "true".
    ChannelNotifyProps:
      type: object
      properties:
        email:
          type: string
          description: Set to "true" to enable email notifications, "false" to disable, or "default" to use the global user notification setting.
        push:
          type: string
          description: Set to "all" to receive push notifications for all activity, "mention" for mentions and direct messages only, "none" to disable, or "default" to use the global user notification setting.
        desktop:
          type: string
          description: Set to "all" to receive desktop notifications for all activity, "mention" for mentions and direct messages only, "none" to disable, or "default" to use the global user notification setting.
        mark_unread:
          type: string
          description: Set to "all" to mark the channel unread for any new message, "mention" to mark unread for new mentions only. Defaults to "all".
    ChannelUnread:
      type: object
      properties:
        team_id:
          type: string
        channel_id:
          type: string
        msg_count:
          type: integer
        mention_count:
          type: integer
    AppError:
      type: object
      properties:
        status_code:
          type: integer
        id:
          type: string
        message:
          type: string
        request_id:
          type: string
    PostList:
      type: object
      properties:
        order:
          type: array
          items:
            type: string
          example:
          - post_id1
          - post_id12
        posts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Post'
        next_post_id:
          type: string
          description: The ID of next post. Not omitted when empty or not relevant.
        prev_post_id:
          type: string
          description: The ID of previous post. Not omitted when empty or not relevant.
        has_next:
          type: boolean
          description: Whether there are more items after this page.
    Post:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a post was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a post was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a post was deleted
          type: integer
          format: int64
        edit_at:
          type: integer
          format: int64
        user_id:
          type: string
        channel_id:
          type: string
        root_id:
          type: string
        original_id:
          type: string
        message:
          type: string
        type:
          type: string
        props:
          type: object
        hashtag:
          type: string
        file_ids:
          type: array
          items:
            type: string
        pending_post_id:
          type: string
        metadata:
          $ref: '#/components/schemas/PostMetadata'
    PostMetadata:
      type: object
      description: Additional information used to display a post.
      properties:
        embeds:
          type: array
          description: 'Information about content embedded in the post including OpenGraph
            previews, image link previews, and message attachments. This field will
            be null if the post does not contain embedded content.

            '
          items:
            type: object
            properties:
              type:
                type: string
                description: The type of content that is embedded in this point.
                enum:
                - image
                - message_attachment
                - opengraph
                - link
              url:
                type: string
                description: The URL of the embedded content, if one exists.
              data:
                type: object
                description: 'Any additional information about the embedded content.
                  Only used at this time to store OpenGraph metadata.

                  This field will be null for non-OpenGraph embeds.

                  '
        emojis:
          type: array
          description: 'The custom emojis that appear in this point or have been used
            in reactions to this post. This field will be null if the post does not
            contain custom emojis.

            '
          items:
            $ref: '#/components/schemas/Emoji'
        files:
          type: array
          description: 'The FileInfo objects for any files attached to the post. This
            field will be null if the post does not have any file attachments.

            '
          items:
            $ref: '#/components/schemas/FileInfo'
        images:
          type: object
          description: 'An object mapping the URL of an external image to an object
            containing the dimensions of that image. This field will be null if the
            post or its embedded content does not reference any external images.

            '
          items:
            type: object
            properties:
              height:
                type: integer
              width:
                type: integer
        reactions:
          type: array
          description: 'Any reactions made to this point. This field will be null
            if no reactions have been made to this post.

            '
          items:
            $ref: '#/components/schemas/Reaction'
        priority:
          type: object
          description: 'Post priority set for this post. This field will be null if
            no priority metadata has been set.

            '
          properties:
            priority:
              type: string
              description: The priority label of a post, could be either empty, important,
                or urgent.
            requested_ack:
              type: boolean
              description: Whether the post author has requested for acknowledgements
                or not.
        acknowledgements:
          type: array
          description: 'Any acknowledgements made to this point.

            '
          items:
            $ref: '#/components/schemas/PostAcknowledgement'
    Emoji:
      type: object
      properties:
        id:
          description: The ID of the emoji
          type: string
        creator_id:
          description: The ID of the user that made the emoji
          type: string
        name:
          description: The name of the emoji
          type: string
        create_at:
          description: The time in milliseconds the emoji was made
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds the emoji was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds the emoji was deleted
          type: integer
          format: int64
    FileInfo:
      type: object
      properties:
        id:
          description: The unique identifier for this file
          type: string
        user_id:
          description: The ID of the user that uploaded this file
          type: string
        post_id:
          description: If this file is attached to a post, the ID of that post
          type: string
        create_at:
          description: The time in milliseconds a file was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a file was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a file was deleted
          type: integer
          format: int64
        name:
          description: The name of the file
          type: string
        extension:
          description: The extension at the end of the file name
          type: string
        size:
          description: The size of the file in bytes
          type: integer
        mime_type:
          description: The MIME type of the file
          type: string
        width:
          description: If this file is an image, the width of the file
          type: integer
        height:
          description: If this file is an image, the height of the file
          type: integer
        has_preview_image:
          description: If this file is an image, whether or not it has a preview-sized
            version
          type: boolean
    Reaction:
      type: object
      properties:
        user_id:
          description: The ID of the user that made this reaction
          type: string
        post_id:
          description: The ID of the post to which this reaction was made
          type: string
        emoji_name:
          description: The name of the emoji that was used for this reaction
          type: string
        create_at:
          description: The time in milliseconds this reaction was made
          type: integer
          format: int64
    PostAcknowledgement:
      type: object
      properties:
        user_id:
          description: The ID of the user that made this acknowledgement.
          type: string
        post_id:
          description: The ID of the post to which this acknowledgement was made.
          type: string
        acknowledged_at:
          description: The time in milliseconds in which this acknowledgement was
            made.
          type: integer
          format: int64
    Channel:
      type: object
      properties:
        id:
          type: string
        create_at:
          description: The time in milliseconds a channel was created
          type: integer
          format: int64
        update_at:
          description: The time in milliseconds a channel was last updated
          type: integer
          format: int64
        delete_at:
          description: The time in milliseconds a channel was deleted
          type: integer
          format: int64
        team_id:
          type: string
        type:
          type: string
        display_name:
          type: string
        name:
          type: string
        header:
          type: string
        purpose:
          type: string
        last_post_at:
          description: The time in milliseconds of the last post of a channel
          type: integer
          format: int64
        total_msg_count:
          type: integer
        extra_update_at:
          description: Deprecated in Mattermost 5.0 release
          type: integer
          format: int64
        creator_id:
          type: string
    PostListWithSearchMatches:
      type: object
      properties:
        order:
          type: array
          items:
            type: string
          example:
          - post_id1
          - post_id12
        posts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Post'
        matches:
          description: A mapping of post IDs to a list of matched terms within the
            post. This field will only be populated on servers running version 5.1
            or greater with Elasticsearch enabled.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            post_id1:
            - search match 1
            - search match 2
    UserThreads:
      type: object
      properties:
        total:
          description: Total number of threads (used for paging)
          type: integer
        threads:
          description: Array of threads
          type: array
          items:
            $ref: '#/components/schemas/UserThread'
    UserThread:
      description: a thread that user is following
      type: object
      properties:
        id:
          type: string
          description: ID of the post that is this thread's root
        reply_count:
          type: integer
          description: number of replies in this thread
        last_reply_at:
          type: integer
          format: int64
          description: timestamp of the last post to this thread
        last_viewed_at:
          type: integer
          format: int64
          description: timestamp of the last time the user viewed this thread
        participants:
          type: array
          description: list of users participating in this thread. only includes IDs unless 'extended' was set to 'true'
          items:
            $ref: '#/components/schemas/Post'
        post:
          $ref: '#/components/schemas/Post'
    TeamUnread:
      type: object
      properties:
        team_id:
          type: string
        msg_count:
          type: integer
        mention_count:
          type: integer
  responses:
    BadRequest:
      description: Invalid or missing parameters in URL or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
    Unauthorized:
      description: No access token provided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
    Forbidden:
      description: Do not have appropriate permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
